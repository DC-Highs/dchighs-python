[project]
name = "dchighs"
version = "0.1.0"
description = "Python port of the DC Highs Dragon City libraries (fan-made, not affiliated with SocialPoint)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcuth", email = "me@marcuth.dev" }]
requires-python = ">=3.9,<4.0"
keywords = ["dragon-city", "dchighs", "game", "socialpoint", "dragoncity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# `dc_core` is the only required module and has no third-party dependencies.
# Every other module is opt-in through an extra (see docs/README.md).
dependencies = []

[project.optional-dependencies]
localization = ["httpx (>=0.27,<1.0)"]
statistics = []
assets = ["httpx (>=0.27,<1.0)"]
config = ["httpx (>=0.27,<1.0)", "pydantic (>=2.6,<3.0)"]
config-mapper = [
    "httpx (>=0.27,<1.0)",
    "pydantic (>=2.6,<3.0)",
    "pluralizer (>=1.2,<2.0)",
]
client-state = []
all = [
    "httpx (>=0.27,<1.0)",
    "pydantic (>=2.6,<3.0)",
    "pluralizer (>=1.2,<2.0)",
]

[project.urls]
Homepage = "https://github.com/DC-Highs/dchighs-python"
Documentation = "https://github.com/DC-Highs/dchighs-python/tree/main/docs"
Repository = "https://github.com/DC-Highs/dchighs-python"
Issues = "https://github.com/DC-Highs/dchighs-python/issues"

[tool.poetry]
include = [{ path = "docs", format = "sdist" }, { path = "tests", format = "sdist" }]
packages = [
    { include = "dc_core" },
    { include = "dc_localization" },
    { include = "dc_statistics" },
    { include = "dc_assets" },
    { include = "dc_config" },
    { include = "dc_config_mapper" },
    { include = "dc_client_state" },
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5.0"
poethepoet = ">=0.29"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"

[tool.poe.tasks]
test = "pytest"
cov = "pytest --cov --cov-branch --cov-report=term-missing --cov-fail-under=100"
cov-html = "pytest --cov --cov-branch --cov-report=html"

[tool.coverage.run]
source = [
    "dc_core",
    "dc_localization",
    "dc_statistics",
    "dc_assets",
    "dc_config",
    "dc_config_mapper",
    "dc_client_state",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
